<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MeetMind Live Assistant</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a; /* Tailwind slate-900 */
      color: #f8fafc; /* Tailwind slate-50 */
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .icon {
      font-size: 24px;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .status {
      font-size: 13px;
      color: #94a3b8; /* Tailwind slate-400 */
      margin-bottom: 20px;
      padding: 10px;
      border-radius: 8px;
      background: #1e293b; /* Tailwind slate-800 */
      border: 1px solid #334155; /* Tailwind slate-700 */
      text-align: center;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #6366f1, #4f46e5); /* Indigo gradient */
      box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
      transition: all 0.2s;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 8px -1px rgba(99, 102, 241, 0.5);
    }
    .btn:disabled {
      background: #475569; /* slate-600 */
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .btn.stop {
      background: linear-gradient(135deg, #ef4444, #dc2626); /* Red gradient */
      box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.4);
    }
    .btn.stop:hover {
      box-shadow: 0 6px 8px -1px rgba(239, 68, 68, 0.5);
    }
    .error {
      color: #f87171;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">🧠</div>
    <h1>MeetMind Live</h1>
  </div>
  
  <div id="statusText" class="status">Checking tab...</div>
  
  <button id="toggleBtn" class="btn" disabled>Start Capture</button>
  
  <div id="errorText" class="error"></div>

  <script src="popup.js"></script>
</body>
</html>
